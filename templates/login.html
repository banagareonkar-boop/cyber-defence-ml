<!DOCTYPE html>
<html>

<head>

    <title>Cyber Defence Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #102a43
                );

            color: white;
        }


        .login-container {

            width: 400px;

            padding: 40px;

            background:
                rgba(255,255,255,0.08);

            border-radius: 20px;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.5);

            backdrop-filter: blur(10px);
        }


        .login-container h1 {

            text-align: center;

            color: #00e5ff;

            margin-bottom: 10px;

            font-size: 30px;
        }


        .login-container p {

            text-align: center;

            color: #d5e5ef;

            margin-bottom: 30px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: white;
        }


        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border: none;

            border-radius: 8px;

            background: #ffffff;

            color: #222;

            font-size: 15px;

            outline: none;
        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #00d9ff;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #00a8cc;
        }


        .error {

            background: #ff4444;

            color: white;

            padding: 10px;

            border-radius: 7px;

            text-align: center;

            margin-bottom: 20px;
        }


        .security-text {

            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #9fb3c2;
        }

    </style>

</head>


<body>


    <div class="login-container">

        <h1>Cyber Defence</h1>

        <p>
            Network Attack Detection System
        </p>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">

                Login

            </button>

        </form>
        <div style="text-align:center; margin-top:20px;">

    <span>Don't have an account?</span>

    <a
        href="{{ url_for('register') }}"
        style="color:#00e5ff; text-decoration:none;"
    >
        Create Account
    </a>

</div>


        <div class="security-text">

            🔐 Secure Cyber Defence Dashboard

        </div>

    </div>


</body>

</html>
